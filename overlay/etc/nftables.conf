#!/usr/bin/nft -f
# MAS Shield firewall: nothing from outside can start a connection to this computer.
# Replies to connections YOU start are allowed.

table inet mas_shield
delete table inet mas_shield

table inet mas_shield {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif "lo" accept

    # Needed for normal networking (getting an address, finding the router)
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    ip6 nexthdr icmpv6 icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
