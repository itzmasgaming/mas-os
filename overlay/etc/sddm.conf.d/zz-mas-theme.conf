[Theme]
Current=mas

[General]
# QML_XHR_ALLOW_FILE_READ lets the login screen read /var/lib/mas/blank-users (which accounts have no password).
# QT_QUICK_BACKEND=software draws the login screen with the CPU: it is simple, fast enough, and it
# never leaves a black screen in a virtual machine, also after a wrong password.
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1,QT_QUICK_BACKEND=software
