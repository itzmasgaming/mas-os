# MAS updater settings (read by /usr/local/bin/mas-update)
# Where the update list is. The first address that answers with a valid list is used.
URL=https://github.com/itzmasgaming/mas-os-updates/updates.mas
URL=https://raw.githubusercontent.com/itzmasgaming/mas-os-updates/main/updates.mas
URL=https://raw.githubusercontent.com/itzmasgaming/mas-os-updates/master/updates.mas
# 1 = download and install updates by itself (like Windows 10), 0 = only tell the user that one is ready
AUTO_INSTALL=1
