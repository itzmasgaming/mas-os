name: Build MAS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the ISO inside an Arch Linux container
        run: |
          docker run --rm --privileged -v "$PWD":/mas -w /mas archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed archiso && bash build-mas.sh"

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: MAS-ISO
          path: out/*
          compression-level: 0
          retention-days: 7
