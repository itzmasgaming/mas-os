name: Build MAS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Build the ISO inside an Arch Linux container
        run: |
          docker run --rm --privileged -v "$PWD":/mas -w /mas archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed archiso && bash build-mas.sh"

      - name: Make the ISO readable
        run: sudo chmod -R a+rX out

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: MAS-ISO
          path: out/*
          compression-level: 0
          retention-days: 7
